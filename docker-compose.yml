services:
  nginx:
    image: nginx:latest
    container_name: clickcv-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./app/static:/app/static
    depends_on:
      - web
    networks:
      - clickcv-network

  web:
    build: .
    container_name: clickcv-app
    expose:
      - "5000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - clickcv-network
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "python -c 'from app import create_app; from app.extensions import db; app = create_app(); app.app_context().push(); db.create_all()'
      && gunicorn --bind 0.0.0.0:5000 --workers 2 run:app"

  db:
    image: postgres:15
    container_name: clickcv-db
    env_file:
      - .env
    volumes:
      - clickcv-pgdata:/var/lib/postgresql/data
    networks:
      - clickcv-network
    restart: unless-stopped

volumes:
  clickcv-pgdata:
  huggingface-cache:

networks:
  clickcv-network: